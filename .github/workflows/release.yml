name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep -oP '<Version>\K[^<]+' src/ChatTags.csproj)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: dotnet build src/ChatTags.csproj -c Release -o build -p:Version=${{ steps.version.outputs.version }}

      # Server layout: extract into game/csgo/
      - name: Package
        run: |
          mkdir -p package/addons/counterstrikesharp/plugins/ChatTags
          cp build/ChatTags.dll package/addons/counterstrikesharp/plugins/ChatTags/
          cd package && zip -r ../ChatTags-v${{ steps.version.outputs.version }}.zip addons

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatTags-v${{ steps.version.outputs.version }}
          path: package/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "ChatTags-v${{ steps.version.outputs.version }}.zip" \
            --title "ChatTags $GITHUB_REF_NAME" \
            --notes-file .github/release-notes/$GITHUB_REF_NAME.md
